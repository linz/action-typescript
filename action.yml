name: "Yarn, Typescript & NPM"
description: "Build, Lint and Test a typescript package"
inputs:
  registry-url:
    description: "Registry to use NPM or github"
    required: false
    default: "https://registry.npmjs.org"
  package-manager:
    description: "Package manager to use yarn or npm"
    required: false
    default: "npm"
  node-version:
    description: "Which version of NodeJS to use"
    required: false
  node-version-file:
    description: "File to read NodeJS version from"
    required: false
  fetch-depth:
    description: "Number of commits to fetch. 0 indicates all history for all branches and tags."
    required: false
    default: "0"
  clean:
    description: "Whether to execute git clean -ffdx && git reset --hard HEAD before fetching"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        clean: ${{ inputs.clean }}

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ (inputs.node-version == '' && inputs.node-version-file == '') && '24.x' || inputs.node-version }}
        node-version-file: ${{ inputs.node-version-file }}
        registry-url: ${{ inputs.registry-url }}
        cache: ${{ inputs.package-manager }}

    - name: "Install"
      shell: "bash"
      run: |
        if [ "${{ inputs.package-manager }}" == "yarn" ]; then
          yarn install --frozen-lockfile --check-files
        elif [ "${{ inputs.package-manager }}" == "npm" ]; then
          npm ci
        else 
          echo "Unknown package-manager ${{ inputs.package-manager }}"
          exit 1
        fi

    - run: npm run build --if-present
      shell: "bash"
    - run: npm run lint --if-present
      shell: "bash"
    - run: |
        changes=$(git status --porcelain)
        if [ -n "$changes" ]; then
          echo "Found uncommitted changes after running lint."
          echo "(ensure lint is not configured to --fix)"
          echo "$changes"
          exit 1
        fi
      shell: "bash"
    - run: npm run test --if-present
      shell: "bash"
